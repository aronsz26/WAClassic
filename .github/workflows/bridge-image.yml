# builds the bridge image (amd64 + arm64) -> ghcr.io/<owner>/wa-classic-bridge
# on version tags (v1.0 -> :1.0 + :latest) or manually. app debs come from the release assets
name: bridge image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read # release assets
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: app packages from the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" -p '*.deb' -D bridge/debs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wa-classic-bridge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BRIDGE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: ${{ steps.meta.outputs.tags }}
